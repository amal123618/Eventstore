{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock title %}
{% block main-content %}
<div class="container py-5" style="max-width: 520px;">
  <h3 class="mb-3">Forgot your password?</h3>
  <p class="text-muted">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Send reset link</button>
  </form>
</div>
{% endblock main-content %}
