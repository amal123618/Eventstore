{% extends 'base.html' %}
{% block title %}Manage Events{% endblock title %}
{% block main-content %}
<div class="container py-4">
  <h3 class="mb-3">Events</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Date</th>
        <th>User</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for e in events %}
      <tr>
        <td>{{ e.id }}</td>
        <td>{{ e.name }}</td>
        <td>{{ e.event_date }}</td>
        <td>{{ e.user }}</td>
        <td>
          <a href="{% url 'admin_event_delete' e.id %}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('Delete this event?');">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="5" class="text-center">No events found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock main-content %}
